apiVersion: v1
kind: Pod
metadata:
  labels:
    run: pod4
  name: pod4
spec:
  containers:
  - image: nginx
    name: pod4
    resources: {}
    volumeMounts:
      - name: volumeconfigmap
        mountPath: /etc/nginx/conf.d/default.conf
        subPath: default.conf
  volumes:
    - name: volumeconfigmap
      configMap:
        name: configmapnginx
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
