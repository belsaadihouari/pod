apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydepoly
  labels:
    apps: mydeploy
spec:
  replicas: 3
  selector:
    matchLabels:
      apps: frontend
  template:
    metadata:
      name: mypod
      labels:
        apps: frontend
    spec:
      containers:
        - name: mypod
          image: belsaadi/nginx-vim-server2:latest
          ports:
            - name: http
              protocol: TCP
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          
