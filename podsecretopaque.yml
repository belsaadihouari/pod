apiVersion: v1
kind: Pod
metadata:
  name: mypod
spec:
  containers:
    - name: mycontainer
      image: busybox
      command:
        - sh
        - -c
        - |
          sleep infinity
      env:
        - name: USER_NAME
          valueFrom:
            secretKeyRef:
              name: myopaquesecret
              key: USER_NAME
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: myopaquesecret
              key: PORT  
