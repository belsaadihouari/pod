apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mydaemonset
  labels:
    app: mydaemonset
spec:
  selector:
    matchLabels:
      app: fluent
  template:
    metadata:
      name: mydaemonsetcpontainer
      labels:
        app: fluent
    spec:
      nodeSelector:
        environment: "prod"
      containers:
        - name: mycontainer
          image: fluent/fluentd:v1.17.1-1.0
