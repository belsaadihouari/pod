apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mydaemonset
  labels:
    app: mydaemonset
spec:
  selector:
    matchLabels:
      app: container-daemonset
  template:
    metadata:
      name: mycontainer
      labels:
        app: container-daemonset
    spec:
    


    
      containers:
        - name: mycontainer
          image: busybox
          command:
          - sh
          - -c
          - |
            sleep 30
            echo "Traitement en cours....."
            sleep 50
            echo "Traitement Terminé"
            sleep infinity
      nodeSelector:
        environment: "test"
 
