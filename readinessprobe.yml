apiVersion: v1
kind: Pod
metadata:
  name: mypod
spec:
  containers:
    - name: mypod
      image: nginx
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 3
        timeoutSeconds: 2
        successThreshold: 3
        failureThreshold: 3
