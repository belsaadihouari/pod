apiVersion: v1
kind: LimitRange
metadata:
  name: mylimitrange
spec:
  limits:
  - default: # this section defines default limits
      cpu: 700m
      memory: 512Mi
    defaultRequest: # this section defines default requests
      cpu: 500m
      memory: 256Mi
    max: # max and min define the limit range
      cpu: "1"
      memory: 1Gi
    min:
      cpu: 100m
      memory: 128Mi
    type: Container

