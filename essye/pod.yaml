apiVersion: v1
kind: Pod
metadata:
  labels:
    run: mypod
  name: mypod
spec:
  automountServiceAccountToken: false
  serviceAccountName: myserviceaccount
  containers:
  - image: nginx
    name: mypod
    ports:
    - containerPort: 80
    volumeMounts:
      - mountPath: /var/run/secrets/tokens
        name: vault-token
  volumes:
  - name: vault-token
    projected:
      sources:
      - serviceAccountToken:
          path: vault-token
          expirationSeconds: 7200
          audience: frontend
  dnsPolicy: ClusterFirst
  restartPolicy: Always
