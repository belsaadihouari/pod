apiVersion: batch/v1
kind: Job
metadata:
  name: myjob
spec:
  completions: 1
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: myjob-container
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "sakoooooooooora"
              sleep 20
              echo "sakkkkkkkkkkkkkkkora"
